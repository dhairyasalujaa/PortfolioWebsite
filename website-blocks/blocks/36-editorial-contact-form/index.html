<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editorial contact form</title><link rel="stylesheet" href="style.css"></head><body><section class="editorial-contact"><!-- EDIT: introduction, form action, scope options, and contact details --><header><p>New commissions</p><h1>Tell us what you want to make.</h1><span>We work with cultural institutions, independent publishers, and thoughtful brands. Expect a reply within three working days.</span></header><form action="#" method="post"><div class="editorial-contact__row"><label>Full name<input name="name" autocomplete="name" required></label><label>Email address<input name="email" type="email" autocomplete="email" required></label></div><fieldset><legend>Project scope</legend><label><input type="checkbox" name="scope" value="editorial"> Editorial direction</label><label><input type="checkbox" name="scope" value="identity"> Visual identity</label><label><input type="checkbox" name="scope" value="digital"> Digital experience</label><label><input type="checkbox" name="scope" value="other"> Something else</label></fieldset><label>Project note<textarea name="message" rows="5" placeholder="A little context, ambition, timing, and budget range…" required></textarea></label><div class="editorial-contact__submit"><small>Your details are used only to reply to this enquiry.</small><button type="submit">Send enquiry <span aria-hidden="true">↗</span></button></div></form></section></body></html>
